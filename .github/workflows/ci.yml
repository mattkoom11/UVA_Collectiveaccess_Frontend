name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# ADMIN_PASSWORD is deliberately NOT set here: the production guard in
# lib/adminAuth.ts resolves lazily, so the build must succeed without it and
# CI will fail loudly if that ever regresses.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
